[project]
name = "mojo-hyperloglog"
version = "0.1.0"
description = "HyperLogLog cardinality estimation accelerated by Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "hyperloglog", "cardinality", "streaming"]
dependencies = ["numpy", "msgpack"]

[project.optional-dependencies]
dev = ["pytest", "hyperloglog==0.1.8"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-hyperloglog"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
